  -
    h: "Half the budget"
    p: "One build instead of two, with a native feel on both platforms."
  -
    h: "On the home screen"
    p: "An icon on your customers' phones beats a forgotten bookmark."
  -
    h: "Direct notifications"
    p: "You reach your users without going through an algorithm or buying reach."
faqs:
  -
    q: "Why Flutter rather than native?"
    a: "One codebase for both platforms, with rendering and performance equivalent to native in the vast majority of cases. Budget and timelines are halved."
  -
    q: "Do you handle App Store and Google Play publishing?"
    a: "Yes, end to end: developer accounts, listings, screenshots, compliance and submission. Allow one to two weeks of review on Apple's and Google's side."
  -
    q: "What happens after launch?"
    a: "Three months of support are included. After that, a maintenance plan covers the updates iOS and Android require every year."
  -
    q: "Can I build a mobile app for free?"
    a: "Free has its limits: no-code tools can produce a mockup or a very simple app. For an app published on the App Store and Google Play, with payments and customer accounts, you need real development: at Wevtex, from MAD 8,000."
  -
    q: "Flutter or native development?"
    a: "Flutter for the vast majority of projects: one codebase produces a native app for iOS and Android, on a smaller budget. Separate native development is justified for very specific hardware needs, rare in business apps."
  -
    q: "Who publishes the app on the App Store and Google Play?"
    a: "We do. Publishing, preparing the store listings and dealing with Apple and Google are part of the service. The developer accounts are opened in your name."
  -
    q: "How long does it take to develop a mobile app?"
    a: "Four to six weeks for an essential app, eight to twelve weeks for a complete app with accounts and payments. The deadline is on the quote."
