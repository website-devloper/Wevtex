faqs:
  -
    q: "How long does it take to build the website?"
    a: "Two to four weeks for a business website, four to eight for an online store. The deadline is firm and written on the quote."
  -
    q: "Can I edit the content myself?"
    a: "Yes. You get a simple interface for your text, images and pages, with a one-hour walkthrough."
  -
    q: "Do I really own the website?"
    a: "Completely. Code, content, domain and hosting are put in your name and handed over at delivery."
  -
    q: "Next.js or WordPress?"
    a: "Next.js for maximum speed and custom work; WordPress when you want a familiar admin and to publish without us. We advise based on your team and your budget, not on our preferences."
  -
    q: "What are website prices in Morocco at Wevtex?"
    a: "A business website starts at MAD 1,899, a 15-page company website at MAD 2,999 and an online store at MAD 6,999. Every project gets a firm quote after a fifteen-minute call."
  -
    q: "Do you work with foreign companies and in English?"
    a: "Yes. We work in English, French and Darija, with clients in Morocco and abroad. Calls happen by video, follow-up on WhatsApp, and quotes and invoices are in Moroccan dirhams."
  -
    q: "Can I build a website for free in Morocco?"
    a: "Yes, with free tools such as Google Sites or the free plans of website builders. The site then sits on a subdomain, shows the platform's branding and stays with the platform. For a professional website in your name, on your domain and ready for Google, our package starts at MAD 1,899."
  -
    q: "How much does a Shopify or WordPress website cost?"
    a: "The build follows our packages, from MAD 1,899 for a business website and MAD 6,999 for an online store. Shopify adds a monthly subscription paid directly to Shopify; WordPress has no license fee but needs hosting and regular updates."
  -
    q: "Business website or ecommerce website: which one?"
    a: "A business website if the sale closes through a conversation (a quote, an appointment, advice). An online store if customers can choose, pay and receive a product on their own. It's not about company size but about how you sell today."
  -
    q: "Can you redesign my existing website?"
    a: "Yes. We audit the current site, keep what works, redirect every old address and deliver a faster, better-ranked website on your current domain."
  -
    q: "Do you build websites in every city in Morocco?"
    a: "Yes. From Casablanca we design websites for clients in Rabat, Marrakech, Tangier, Agadir, Fez and across Morocco, with video calls and follow-up on WhatsApp."
