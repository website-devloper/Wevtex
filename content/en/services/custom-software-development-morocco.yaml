  - "An analysis of your current processes before any code."
  - "A Windows and macOS application with an installer and automatic updates."
  - "Your existing data imported, Excel included."
  - "Training for your teams and user documentation."
outcomes:
  -
    h: "No per-seat subscription"
    p: "You pay for development once, not a monthly license multiplied by your staff."
  -
    h: "Works without internet"
    p: "Your teams keep working when the connection drops, and sync happens when it's back."
  -
    h: "Exactly your processes"
    p: "The software follows your organization instead of forcing you into a generic mold."
faqs:
  -
    q: "Why not simply buy software off the shelf?"
    a: "If existing software fits, we'll tell you, it's cheaper for you. Custom makes sense when your processes are specific or when per-seat licenses end up costing more than the development."
  -
    q: "Can you recover our Excel data?"
    a: "Yes. Importing your existing files is part of the project: we import the history and check its consistency before go-live."
  -
    q: "What if you're no longer around?"
    a: "The source code is delivered to you, documented. Any developer can take over the project, which is precisely the point of not depending on a software vendor."
  -
    q: "Is there free sales management software in Morocco?"
    a: "Free and open-source software exists and is often enough to start. It shows its limits when your management rules fall outside the standard or several workstations must work together; that is when custom software makes sense."
  -
    q: "Desktop software or web application?"
    a: "Desktop software suits teams working at fixed workstations, sometimes offline. A web application suits access from anywhere, through a browser. We advise based on how you actually work."
  -
    q: "Can you import our existing Excel files?"
    a: "Yes. Importing your data, from Excel or old software, is part of the service, so the tool is usable from day one."
  -
    q: "Do we own the source code?"
    a: "Yes. The source code and documentation are handed over at delivery, which leaves you free to develop it further with us or with another provider."
