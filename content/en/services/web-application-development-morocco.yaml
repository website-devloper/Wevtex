    - "platform."
  subtitle: "Custom projects rarely fail for technical reasons."
  points:
    -
      h: "Discovery is a deliverable"
      p: "It's invoiced, short, and you leave with it: documented processes, written rules, a priced scope. Even if you don't continue with us."
    -
      h: "Delivered in usable batches"
      p: "Each batch goes live and gets used. You don't discover the whole platform on the last day."
    -
      h: "A team that stays"
      p: "The same people from discovery to go-live. No internal handovers, no takeover midway."
    -
      h: "Your code and your data"
      p: "Code repository, documentation, infrastructure access. You're never captive to a provider, us included."
