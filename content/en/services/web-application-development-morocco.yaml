  - "Integrations"
includes:
  - "Serious discovery: processes, business rules, edge cases."
  - "A custom web platform, with roles, permissions and an audit trail."
  - "Integration with your existing tools through APIs."
  - "Complete technical and functional documentation."
outcomes:
  -
    h: "Your rules, respected"
    p: "The edge cases that make your business valuable are coded, not worked around."
  -
    h: "Everything connected"
    p: "Your tools finally talk to each other: no more double entry or files sent by email."
  -
    h: "Ready to grow"
    p: "An architecture that handles ten times more users without being rewritten."
faqs:
  -
    q: "How do you assess a complex project?"
    a: "Through a separately invoiced discovery phase, short and concrete: processes, rules, priorities. It ends with a firmly priced scope, and it's yours even if you don't continue with us."
  -
    q: "Can you connect to our ERP?"
    a: "Yes, as long as it exposes an API or an accessible database. We have connected invoicing, stock and payroll tools to custom platforms."
  -
    q: "Who hosts the platform?"
    a: "Your choice: on your side, or on infrastructure we manage. Either way, access and code stay in your name."
  -
    q: "What does a web developer cost in Morocco?"
    a: "Rather than a daily rate, we price per project, so the price is firm: discovery from MAD 6,000, a platform or business tool from MAD 18,000, a complete SaaS from MAD 60,000."
  -
    q: "Do you work with companies outside Morocco?"
    a: "Yes. We work remotely with clients in France, Belgium and Canada, in English or French, with weekly check-ins, a shared staging environment and fixed-price quotes."
  -
    q: "What is the difference between a website and a web application?"
    a: "A website presents your business and generates leads. A web application is a tool: users log in, enter, look up and process data, with different rights depending on their role."
  -
    q: "Which technologies do you use for web development?"
    a: "Next.js and React for the interface, Node.js and PostgreSQL for the server and data, and documented APIs to connect your tools. Widely used technologies, so your platform doesn't depend on us."
  -
    q: "Can you take over an existing application?"
    a: "Yes, after an audit of the existing code. We tell you honestly whether it is better to improve the application or rebuild it, and why."
