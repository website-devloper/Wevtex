      p: "We read your past conversations before writing anything. The flows answer the questions actually asked."
    -
      h: "Handover at the right moment"
      p: "The bot recognizes what it can't handle and passes to a person with the full history, without making the customer repeat themselves."
    -
      h: "Tuned every month"
      p: "We reread the conversations and fix what jams. A bot nobody maintains degrades within weeks."
