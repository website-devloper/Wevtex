name: "Logiciels bureau"
serviceId: "desktop-apps"
order: 5
eyebrow: "Logiciels bureau"
keyword: "logiciel sur mesure Maroc"
h1: "Logiciel sur mesure au Maroc,\nqui suit votre organisation."
h1Em:
  - "votre"
  - "organisation."
intro: "Si vos équipes passent leurs journées entre trois fichiers Excel et un logiciel qui ne colle pas à votre métier, le problème n'est pas vos équipes. Nous développons le logiciel Windows et macOS qui suit votre façon de travailler, sans licence par poste, et utilisable même sans connexion."
tags:
  - "Windows"
  - "macOS"
  - "Hors ligne"
  - "Reporting"
includes:
  - "L'analyse de vos processus actuels avant toute ligne de code."
  - "Une application Windows et macOS avec installateur et mises à jour automatiques."
  - "La reprise de vos données existantes, Excel compris."
  - "La formation de vos équipes et la documentation d'utilisation."
outcomes:
  -
    h: "Zéro abonnement par poste"
    p: "Vous payez le développement une fois, pas une licence mensuelle multipliée par vos salariés."
  -
    h: "Fonctionne sans internet"
    p: "Vos équipes continuent de travailler quand la connexion tombe, la synchronisation se fait au retour."
  -
    h: "Exactement vos processus"
    p: "Le logiciel épouse votre organisation, au lieu de vous forcer à entrer dans un moule générique."
faqs:
  -
    q: "Pourquoi pas un simple logiciel du marché ?"
    a: "Si un logiciel existant convient, nous vous le dirons, c'est moins cher pour vous. Le sur-mesure se justifie quand vos processus sont spécifiques ou quand les licences par poste deviennent plus coûteuses que le développement."
  -
    q: "Peut-on récupérer nos données Excel ?"
    a: "Oui. La reprise des fichiers existants fait partie du projet : nous importons l'historique et vérifions la cohérence avant la mise en service."
  -
    q: "Que se passe-t-il si vous n'êtes plus là ?"
    a: "Le code source vous est livré et documenté. N'importe quel développeur peut reprendre le projet, c'est précisément l'intérêt de ne pas dépendre d'un éditeur."
  -
    q: "Existe-t-il un logiciel de gestion commerciale gratuit au Maroc ?"
    a: "Des logiciels gratuits ou open source existent et suffisent souvent pour démarrer. Ils montrent leurs limites quand vos règles de gestion sortent du standard ou que plusieurs postes doivent travailler ensemble ; c'est là qu'un logiciel sur mesure se justifie."
  -
    q: "Logiciel de bureau ou application web ?"
    a: "Un logiciel de bureau convient quand vos équipes travaillent sur des postes fixes, parfois sans connexion. Une application web convient quand il faut y accéder de partout, depuis un navigateur. Nous vous conseillons selon votre usage réel."
  -
    q: "Pouvez-vous reprendre nos fichiers Excel existants ?"
    a: "Oui. La reprise de vos données, depuis Excel ou un ancien logiciel, fait partie de la prestation, pour que l'outil soit utilisable dès le premier jour."
  -
    q: "Le code source nous appartient-il ?"
    a: "Oui. Le code source et la documentation vous sont remis à la livraison, ce qui vous laisse libre de le faire évoluer avec nous ou avec un autre prestataire."
whyUs:
  title: "Pourquoi nous confier\nvotre logiciel."
  titleEm:
    - "votre"
    - "logiciel."
  subtitle: "Le sur-mesure a mauvaise réputation. Souvent pour de bonnes raisons."
  points:
    -
      h: "Nous vous dirons si c'est inutile"
      p: "Si un logiciel du marché couvre 90 % de votre besoin, nous vous le dirons plutôt que de vendre un développement."
    -
      h: "L'analyse avant le code"
      p: "Nous passons du temps dans vos bureaux à regarder comment vous travaillez. C'est ce qui évite de livrer un outil que personne n'ouvre."
    -
      h: "Livré par lots"
      p: "Vous utilisez les premières fonctions au bout de quelques semaines, sans attendre la fin du projet pour découvrir le résultat."
    -
      h: "Aucune licence par poste"
      p: "Vous installez le logiciel sur autant de postes que nécessaire. Le prix ne dépend pas de votre effectif."
