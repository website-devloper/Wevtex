name: "Applications mobiles"
serviceId: "mobile-apps"
order: 4
eyebrow: "Applications mobiles"
keyword: "développement application mobile Maroc"
h1: "Développement d'application mobile\nau Maroc, iOS et Android."
h1Em:
  - "iOS"
  - "et"
  - "Android."
intro: "Une application ne vaut que si vos clients l'ouvrent. Nous la concevons autour de ce qu'ils font vraiment, puis nous la développons avec Flutter : un seul code pour iOS et Android, un budget divisé par deux, et la publication sur les stores prise en charge."
tags:
  - "Flutter"
  - "iOS"
  - "Android"
  - "API"
includes:
  - "Le design des écrans avant le développement, validé par vous."
  - "Une application native iOS et Android issue d'un seul code."
  - "La connexion à votre système existant : site, stock, paiement."
  - "La publication sur l'App Store et Google Play, comptes compris."
outcomes:
  -
    h: "Un budget divisé"
    p: "Un seul développement au lieu de deux, pour un rendu natif sur les deux plateformes."
  -
    h: "Présent sur l'écran d'accueil"
    p: "Une icône sur le téléphone de vos clients vaut mieux qu'un favori oublié."
  -
    h: "Notifications directes"
    p: "Vous touchez vos utilisateurs sans passer par un algorithme ni acheter de la portée."
faqs:
  -
    q: "Pourquoi Flutter plutôt que du natif ?"
    a: "Un seul code pour les deux plateformes, pour un rendu et des performances équivalents au natif dans la grande majorité des cas. Le budget et les délais sont réduits de moitié."
  -
    q: "Gérez-vous la publication sur les stores ?"
    a: "Oui, de bout en bout : création des comptes développeur, fiches, captures, conformité et soumission. Comptez une à deux semaines de validation côté Apple et Google."
  -
    q: "Que se passe-t-il après la mise en ligne ?"
    a: "Trois mois d'accompagnement sont inclus. Ensuite, un forfait de maintenance couvre les mises à jour imposées par iOS et Android, qui sortent chaque année."
  -
    q: "Peut-on créer une application mobile gratuitement ?"
    a: "Pour une création d'application mobile, le gratuit a ses limites : des outils no code permettent de monter une maquette ou une application très simple. Pour une application publiée sur l'App Store et Google Play, avec paiement et comptes clients, il faut un développement : chez Wevtex, à partir de 8 000 DH."
  -
    q: "Flutter ou développement natif ?"
    a: "Flutter pour la grande majorité des projets : un seul code produit une application mobile native pour iOS et Android, avec un budget réduit. Le développement natif séparé se justifie pour des besoins très spécifiques du matériel, rares dans les applications d'entreprise."
  -
    q: "Qui publie l'application sur l'App Store et Google Play ?"
    a: "Nous. La publication, la préparation des fiches et les échanges avec Apple et Google font partie de la prestation. Les comptes développeur sont ouverts à votre nom."
  -
    q: "Combien de temps pour développer une application mobile ?"
    a: "Quatre à six semaines pour une application essentielle, huit à douze semaines pour une application complète avec comptes et paiement. Le délai figure sur le devis."
whyUs:
  title: "Pourquoi nous confier\nvotre application."
  titleEm:
    - "votre"
    - "application."
  subtitle: "Le mobile est le poste où les projets dérapent le plus souvent."
  points:
    -
      h: "Un devis ferme avant de coder"
      p: "Le périmètre est écrit et chiffré. Les évolutions en cours de route sont chiffrées à part, jamais imposées."
    -
      h: "Une version testable à mi-parcours"
      p: "Vous manipulez l'application avant qu'elle ne soit finie. Les corrections coûtent bien moins cher à ce moment-là."
    -
      h: "La publication comprise"
      p: "Les refus de l'App Store sont fréquents et déroutants. Nous gérons la soumission et les allers-retours jusqu'à la validation."
    -
      h: "Le code source est à vous"
      p: "Livré, documenté et transférable. Un autre prestataire peut reprendre le projet sans repartir de zéro."
