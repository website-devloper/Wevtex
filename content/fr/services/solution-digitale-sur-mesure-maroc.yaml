name: "Solutions digitales sur mesure"
serviceId: "custom-solutions"
order: 6
eyebrow: "Solutions sur mesure"
keyword: "développement web sur mesure Maroc"
h1: "Développement web sur mesure,\nquand rien d'existant ne suffit."
h1Em:
  - "ne"
  - "suffit."
intro: "Quand vos équipes recopient les mêmes données dans trois outils et que vos clients appellent pour savoir où en est leur dossier, il vous faut une plateforme à vous. Nous concevons applications web, portails clients et SaaS qui suivent exactement vos règles, et tiennent la charge quand vous grandissez."
tags:
  - "SaaS"
  - "API"
  - "Extranet"
  - "Intégrations"
includes:
  - "Un cadrage sérieux : processus, règles métier, cas particuliers."
  - "Une plateforme web sur mesure, avec rôles, permissions et traçabilité."
  - "L'intégration à vos outils existants par API."
  - "Une documentation technique et fonctionnelle complète."
outcomes:
  -
    h: "Vos règles, respectées"
    p: "Les cas particuliers qui font la valeur de votre métier sont codés, pas contournés."
  -
    h: "Tout relié"
    p: "Vos outils se parlent enfin : plus de double saisie ni de fichiers échangés par mail."
  -
    h: "Prêt à grandir"
    p: "Une architecture qui accepte dix fois plus d'utilisateurs sans être réécrite."
faqs:
  -
    q: "Comment évaluez-vous un projet complexe ?"
    a: "Par une phase de cadrage facturée à part, courte et concrète : processus, règles, priorités. Elle débouche sur un périmètre chiffré fermement, et elle vous appartient même si vous ne poursuivez pas avec nous."
  -
    q: "Pouvez-vous vous connecter à notre ERP ?"
    a: "Oui, dès lors qu'il expose une API ou une base accessible. Nous avons connecté des outils de facturation, de stock et de paie à des plateformes sur mesure."
  -
    q: "Qui héberge la plateforme ?"
    a: "Au choix : chez vous, ou sur une infrastructure que nous administrons. Dans les deux cas, les accès et le code restent à votre nom."
  -
    q: "Quel est le tarif d'un développeur web au Maroc ?"
    a: "Plutôt qu'un prix de développeur web à la journée, nous chiffrons au projet, pour que le prix soit ferme : un cadrage à partir de 6 000 DH, une plateforme ou un outil métier à partir de 18 000 DH, un SaaS complet à partir de 60 000 DH."
  -
    q: "Quelle différence entre un site web et une application web ?"
    a: "Un site web présente votre activité et génère des contacts. Une application web est un outil : les utilisateurs se connectent, saisissent, consultent et traitent des données, avec des droits différents selon leur rôle."
  -
    q: "Quelles technologies utilisez-vous pour le développement web ?"
    a: "Next.js et React pour l'interface, Node.js et PostgreSQL pour le serveur et les données, et des API documentées pour relier vos outils. Des technologies répandues, pour que votre plateforme ne dépende pas de nous."
  -
    q: "Pouvez-vous reprendre une application existante ?"
    a: "Oui, après un audit du code existant. Nous vous disons honnêtement s'il vaut mieux faire évoluer l'application ou la reconstruire, et pourquoi."
whyUs:
  title: "Pourquoi nous confier\nvotre plateforme."
  titleEm:
    - "votre"
    - "plateforme."
  subtitle: "Les projets sur mesure échouent rarement pour des raisons techniques."
  points:
    -
      h: "Le cadrage est un livrable"
      p: "Il est facturé, court, et vous repartez avec : processus documentés, règles écrites, périmètre chiffré. Même si vous ne poursuivez pas avec nous."
    -
      h: "Livré par lots utilisables"
      p: "Chaque lot est mis en service et utilisé. Vous ne découvrez pas la plateforme entière le dernier jour."
    -
      h: "Une équipe qui reste"
      p: "Les mêmes personnes du cadrage à la mise en service. Aucune passation interne, aucune reprise en cours de route."
    -
      h: "Code et données à vous"
      p: "Dépôt de code, documentation, accès à l'infrastructure. Vous n'êtes jamais captif d'un prestataire, nous compris."
