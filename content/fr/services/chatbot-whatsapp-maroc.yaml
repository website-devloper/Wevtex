intro: "Au Maroc, vos clients écrivent sur WhatsApp et attendent une réponse tout de suite : le soir, le week-end, trente fois par jour la même question. Notre chatbot répond à leur place, en français et en darija, trie les demandes sérieuses et passe la main à votre équipe au bon moment."
