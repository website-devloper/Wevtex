          - Processus documentés
          - Modèle de données
          - Périmètre chiffré
          - Déduit du projet si vous poursuivez
        featuresEn:
          - Workshops with your teams
          - Documented processes
          - Data model
          - Priced scope
          - Deducted from the project if you continue
      - key: Plateforme
        price: 18 000
        showFrom: true
        featured: true
        nameFr: Plateforme
        nameEn: Platform
        noteFr: À partir de · 8 à 12 semaines
        noteEn: From · 8 to 12 weeks
        featuresFr:
          - Portail ou outil métier
          - Comptes, rôles et permissions
          - Tableaux de bord
          - Une intégration incluse
          - 6 mois d'accompagnement
        featuresEn:
          - Portal or business tool
          - Accounts, roles and permissions
          - Dashboards
          - One integration included
          - 6 months of support
      - key: SaaS complet
        price: 60 000
        showFrom: true
        featured: false
        nameFr: SaaS complet
        nameEn: Full SaaS
        noteFr: À partir de · périmètre défini ensemble
        noteEn: From · scope defined together
        featuresFr:
          - Architecture multi-entreprises
          - Abonnements et facturation
          - Intégrations multiples
          - Tests de charge
          - Accompagnement prioritaire
        featuresEn:
          - Multi-tenant architecture
          - Subscriptions and billing
          - Multiple integrations
          - Load testing
          - Priority support
  - service: whatsapp-bots
    tiers:
      - key: Essentiel
        price: 2 400
        showFrom: true
