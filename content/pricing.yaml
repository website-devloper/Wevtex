      - key: Sur mesure
        price: 12 000
        showFrom: true
        featured: false
        nameFr: Sur mesure
        nameEn: Custom
        noteFr: À partir de · périmètre défini ensemble
        noteEn: From · scope defined together
        featuresFr:
